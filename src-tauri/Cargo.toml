[package]
name = "iris-desktop"
version = "0.2.0"
description = "IRIS - an open-source runtime for AI agents that can see, reason, and act on a computer."
authors = ["Solstice AI Studio"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "iris-desktop"

[lib]
name = "iris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1.0", features = ["full"] }

tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

screenshots = "0.8"
image = "0.24"
base64 = "0.22"
cpal = "0.15"
lazy_static = "1.4"

chrono = "0.4"
dirs = "5.0"
serde_yaml = "0.9"
enigo = "0.2"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
sha2 = "0.10"
regex = "=1.12.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
