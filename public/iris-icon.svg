<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="irisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ff0080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0f" stroke="url(#irisGradient)" stroke-width="4"/>

  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#irisGradient)" stroke-width="2" opacity="0.5"/>

  <!-- IRIS eye symbol -->
  <g filter="url(#glow)">
    <!-- Outer eye shape -->
    <ellipse cx="256" cy="256" rx="120" ry="80" fill="none" stroke="url(#irisGradient)" stroke-width="6"/>

    <!-- Inner iris -->
    <circle cx="256" cy="256" r="50" fill="url(#irisGradient)" opacity="0.8"/>

    <!-- Pupil -->
    <circle cx="256" cy="256" r="20" fill="#0a0a0f"/>

    <!-- Highlight -->
    <circle cx="270" cy="240" r="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Sparkle particles -->
  <g fill="#00f3ff" opacity="0.7">
    <circle cx="380" cy="150" r="4"/>
    <circle cx="130" cy="180" r="3"/>
    <circle cx="400" cy="350" r="5"/>
    <circle cx="100" cy="320" r="4"/>
    <circle cx="350" cy="420" r="3"/>
    <circle cx="180" cy="400" r="4"/>
  </g>
</svg>
